<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nest — Pregnancy Companion</title>
  <meta name="description" content="Track her health, meds, doctor visits, tests, food, money, daily tasks, reading and baby's growth — all in one place.">
  <meta name="theme-color" content="#fbf7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#home" class="brand"><img src="icon.svg" alt="" width="28" height="28"> Nest</a>
    <div class="top-actions">
      <a href="#emergency" class="sos" aria-label="Emergency">SOS</a>
      <a href="#settings" class="icon-btn" aria-label="Settings">⚙️</a>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#home" data-tab="home"><span>🏠</span>Today</a>
    <a href="#health" data-tab="health"><span>❤️</span>Health</a>
    <a href="#meds" data-tab="meds"><span>💊</span>Meds</a>
    <a href="#visits" data-tab="visits"><span>🩺</span>Visits</a>
    <a href="#more" data-tab="more"><span>☰</span>More</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
